# Fixed-component GMM ablation on RESC (Charlotte's Step 2b) -- K = 50.
# One point in the K-sweep; identical to the DPMM run except gmm_mode=True and a fixed K.

# Directory to save results
embedding_model_name: ${.model_name}_${.density_model.model_name}_${.resolution}
density_model_name: ${ifequal_else:${.density_model.model_name},dpmm,${density_model.dpmm.max_num_components}_${.density_model.dpmm.gaussian.covariance_type}}_pca_${.embedding_pca_components}
architecture_name: ${.embedding_model_name}_${.density_model_name}
experiment_name: ${.shots}-shot_preprocess=${.preprocess}_objectmask=${.object_mask}_normalize_${.normalize_embeddings}_pos_enc_${.use_positional_encoding}
logdir: results/AnomalyDINODPMM/${.dataset.name}/${.architecture_name}/${.experiment_name}/seed_${.seed}
tag: "gmm"
wandb_log: False
wandb_project: AnomalyDINODPMM
resume: True
skip_builtin_metrics: True                        # stop after saving stats; skip the slow/broken pixel-metric loop

# Embedding model
model_name: dinov2_vits14
normalize_embeddings: True
use_positional_encoding: False
embedding_pca_components: -1
embedding_pca_batchsize: 200

# Experiment hyperparameters
shots: -1
seed: 0
device: cuda:0
object_mask: False
pca_threshold: 28
resize_labels: False
epochs: 20
embedding_batch_size: 12
evaluation_max_batch_size: 8192
normalization: ImageNet
preprocess: agnostic
resolution: 448
feature_resolution_train: 32
feature_resolution_eval: 32

# Visualization
visualize_training_step: False
rotate_visualized_samples: 0
visualize_embedding_maps: False

# Embedding clustering
density_model:
  model_name: dpmm
  dpmm:
    max_num_components: 50                        # FIXED K for this sweep point
    gmm_mode: True                               # use the FiniteGMM (Dirichlet-Process prior disabled)
    update_rate: 0.2
    schedule: ema
    component_type: gaussian
    gaussian:
      covariance_type: full
      covariance_regularization: 1e-3
    create_component_map_plot: False

# Dataset
dataset:
  name: RESC
  data_root: /home/saturn/iwai/iwai141h/datasets/bmad/RESC
  path_train_images: "{data_root}/train/{type_anomaly}"
  path_val_images: "{data_root}/val/{type_anomaly}/img"
  path_val_labels: "{data_root}/val/{type_anomaly}/label"
  path_test_images: "{data_root}/test/{type_anomaly}/img"
  path_test_labels: "{data_root}/test/{type_anomaly}/label"
  objects: [""]
  object_anomalies:
    "": ["ungood"]
